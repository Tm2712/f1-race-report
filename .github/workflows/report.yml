name: Build race report

on:
  schedule:
    - cron: "0 20 * * 0"   # Sunday evening UTC, after most races
    - cron: "0 8 * * 1"    # Monday morning UTC, catches late finishes
  workflow_dispatch:
    inputs:
      year:
        description: "Season (leave blank for latest race)"
        required: false
      round:
        description: "Round number (leave blank for latest race)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache
          key: fastf1-${{ github.run_id }}
          restore-keys: fastf1-
      - run: pip install -r requirements.txt
      - run: python analyze.py ${{ github.event.inputs.year }} ${{ github.event.inputs.round }}
      - name: Commit new report
        run: |
          git config user.name "f1-report-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || (git commit -m "Add race report" && git push)
